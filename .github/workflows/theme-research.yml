name: Weekly Stock Theme Research

on:
  schedule:
    # 21:30 UTC (日) = 6:30 JST (月) 。株ウォッチの週次テーマリサーチ
    - cron: "30 21 * * 0"
  workflow_dispatch: {} # Actionsタブから手動実行してテストできるようにする

jobs:
  research-themes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pandas yfinance

      - name: Run theme research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python theme_research.py

      - name: Commit and push theme_candidates.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add theme_candidates.json
          if git diff --cached --quiet; then
            echo "変化なし。コミットしません。"
          else
            git commit -m "週次テーマリサーチ結果を更新"
            git push
          fi
